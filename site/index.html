<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixelbüro</title>
<style>
  :root {
    --bg: #2b2833;
    --panel: #3a3645;
    --text: #f1ece0;
    --akzent: #f2b84b;
    --link: #9fd8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
    line-height: 1.45;
    padding-inline: 16px;
    padding-block: 12px 32px;
  }
  main { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p { margin: 4px 0 10px; }
  #stage { display: flex; justify-content: center; }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    outline-offset: 4px;
  }
  canvas:focus-visible { outline: 3px solid var(--akzent); }
  #ergebnis { min-height: 1.5em; margin-top: 8px; color: var(--akzent); }
  #nav-titel:focus { outline: none; }
  nav h2 { font-size: 1.05rem; margin: 16px 0 4px; }
  nav ul { margin: 0; padding-left: 1.2em; }
  a { color: var(--link); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }

  #overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #0e0c12;
    display: flex;
    flex-direction: column;
    padding-inline: 16px;
    padding-block: 12px;
    overflow: auto;
  }
  #overlay[hidden] { display: none; }
  #overlay-kopf {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    max-width: 1000px;
    width: 100%;
    margin: 0 auto 8px;
  }
  #overlay-kopf h2 { font-size: 1.1rem; margin: 0; flex: 1 1 220px; }
  #zurueck {
    font: inherit;
    padding: 8px 14px;
    background: var(--akzent);
    color: #1d1a22;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }
  #player { flex: 1 1 auto; max-width: 1000px; width: 100%; margin: 0 auto; background: #fff; min-height: 420px; }
  #player iframe { display: block; width: 100%; height: 100%; min-height: 420px; border: 0; }
  #lade { max-width: 1000px; width: 100%; margin: 0 auto 8px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<main>
  <h1>Pixelbüro</h1>
  <p>Steuerung: Pfeiltasten oder WASD zum Laufen, Leertaste oder Enter an einer Tür oder Maschine. Klicke zuerst auf die Halle oder springe mit Tab hinein.</p>

  <div id="stage">
    <canvas id="halle" width="320" height="180" tabindex="0"
            aria-label="Pixelbüro, eine Halle mit Türen. Die Türen sind auch in der Liste unter der Halle erreichbar."></canvas>
  </div>
  <div id="ergebnis" role="status" aria-live="polite"></div>

  <nav aria-label="Türen">
    <h2 id="nav-titel" tabindex="-1">Türen</h2>
    <ul id="tuerliste"></ul>
  </nav>
</main>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-titel" hidden>
  <div id="overlay-kopf">
    <h2 id="overlay-titel">Tür 1: Projektmanagement, klassisch gegen agil</h2>
    <button id="zurueck" type="button">Zurück zur Halle</button>
  </div>
  <div id="lade" role="status"></div>
  <div id="player"></div>
</div>

<script src="hub.js"></script>
</body>
</html>
